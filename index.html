<script>
(()=>{
const st=document.querySelector('.st'),sc=document.querySelector('.scn');
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const LBL=[sc.dataset.de,sc.dataset.in];
/* names and closing line fill a fixed share of the width, whatever font the phone ends up with */
const fit=()=>document.querySelectorAll('[data-w]').forEach(el=>{el.style.fontSize='';const sw=st.clientWidth,kids=[...el.querySelectorAll('span')],
 w=Math.max(...(kids.length?kids:[el]).map(k=>k.getBoundingClientRect().width)),fs=parseFloat(getComputedStyle(el).fontSize);
 if(w>0&&sw>0)el.style.fontSize=(fs*(+el.dataset.w*sw/100)/w/sw*100).toFixed(2)+'cqw'});
fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);
/* Germany and India are two complete pictures; p (0 to 1) fades the India picture in on top: one single dissolve */
const cl=v=>Math.max(0,Math.min(1,v));
let p=0,raf=0,shower=false;
function set(v){p=cl(v);sc.style.setProperty('--p',p.toFixed(4))}
function done(t){sc.classList.toggle('ind',t===1);sc.classList.remove('busy');sc.setAttribute('aria-label',LBL[t]);
 if(t===1&&!shower){shower=true;flowers(['#f4a7b5','#ffffff','#f6c9a8','#f28c1e','#e8718d'])}}
function go(t,fromDrag){cancelAnimationFrame(raf);const f=p,d=Math.abs(t-f);if(d<.001){set(t);done(t);return}
 const dur=(calm?250:1500)*(fromDrag?Math.max(.4,d):1),t0=performance.now();sc.classList.add('busy');
 const ease=fromDrag?(k=>1-Math.pow(1-k,3)):(k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2);
 const step=now=>{const k=Math.min(1,(now-t0)/dur);set(f+(t-f)*ease(k));if(k<1)raf=requestAnimationFrame(step);else done(t)};
 raf=requestAnimationFrame(step)}
/* swipe: left for India, right for Germany; the picture follows the finger. A tap also switches. */
let dr=null;
sc.addEventListener('pointerdown',e=>{if(e.button>0)return;if(e.pointerType==='mouse')e.preventDefault();
 dr={x:e.clientX,y:e.clientY,p0:p,t:performance.now(),h:null,id:e.pointerId}});
sc.addEventListener('pointermove',e=>{if(!dr||e.pointerId!==dr.id)return;const dx=e.clientX-dr.x,dy=e.clientY-dr.y;
 if(dr.h===null){if(Math.abs(dx)<7&&Math.abs(dy)<7)return;dr.h=Math.abs(dx)>Math.abs(dy);
  if(!dr.h){dr=null;return}cancelAnimationFrame(raf);dr.p0=p;dr.x=e.clientX;sc.classList.add('busy');try{sc.setPointerCapture(e.pointerId)}catch(_){}}
 set(dr.p0-(e.clientX-dr.x)/(sc.clientWidth*.7))});
const up=e=>{if(!dr||e.pointerId!==dr.id)return;const d=dr;dr=null;
 if(!d.h){if(e.type==='pointerup')go(p>.5?0:1);return}
 const v=-(e.clientX-d.x)/Math.max(1,performance.now()-d.t);
 let t;if(d.p0<.5)t=(p>.25||v>.35)?1:0;else t=(p<.75||v<-.35)?0:1;go(t,true)};
sc.addEventListener('pointerup',up);sc.addEventListener('pointercancel',up);
sc.addEventListener('keydown',e=>{const k=e.key;
 if(k==='Enter'||k===' '){e.preventDefault();go(p>.5?0:1)}else if(k==='ArrowRight'){e.preventDefault();go(1)}else if(k==='ArrowLeft'){e.preventDefault();go(0)}});
set(0);
function flowers(colors,n=46){
 if(calm)return;
 const c=document.createElement('canvas');c.className='fx';document.body.appendChild(c);
 const W=innerWidth,Hh=innerHeight,d=Math.min(2,devicePixelRatio||1);c.width=W*d;c.height=Hh*d;
 const x=c.getContext('2d');x.scale(d,d);
 const P=Array.from({length:n},()=>({x:Math.random()*W,y:-20-Math.random()*Hh*.8,s:5+Math.random()*5,v:1.3+Math.random()*1.9,a:Math.random()*6,w:(Math.random()-.5)*.06,k:Math.random()*6,c:colors[Math.random()*colors.length|0]}));
 let t=0;(function f(){
  x.clearRect(0,0,W,Hh);
  for(const q of P){q.y+=q.v;q.a+=q.w;q.k+=.03;q.x+=Math.sin(q.k)*.8;
   x.save();x.translate(q.x,q.y);x.rotate(q.a);x.fillStyle=q.c;
   for(let i=0;i<5;i++){const r=i*Math.PI*2/5;x.beginPath();x.arc(Math.cos(r)*q.s*.55,Math.sin(r)*q.s*.55,q.s*.46,0,7);x.fill()}
   x.fillStyle='#f3bf3f';x.beginPath();x.arc(0,0,q.s*.32,0,7);x.fill();x.restore()}
  if(++t<480)requestAnimationFrame(f);else c.remove()})();
}
})();
